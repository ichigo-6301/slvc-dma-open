    tool: Vivado 2018.3
    evidence:
      - slvc_dma_u5_13ch_bram_architecture_summary
    status: partial
    caveat: "Resource-budget comparison only. The current implementation retains the complete Fixed bank and adds Shared Pool; it does not beat the ideal packed-bank storage lower bound and is not functionally equivalent to MCDMA plus FIFOs."
