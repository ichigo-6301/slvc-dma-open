    <rect x="50" y="160" width="1500" height="55" class="panel-header"/>
    <text x="75" y="196" class="table-head">Main point: 1024 x 4 KiB, HP0_SHARED, 100 MHz, phase 3 ns</text>
    <text x="80" y="258" class="metric">3.831177 MB/s/MHz</text>
    <text x="80" y="300" class="body">E2E = 383.117735 MB/s = 3.064942 Gb/s</text>
    <text x="470" y="258" class="metric">3.831723 MB/s/MHz</text>
