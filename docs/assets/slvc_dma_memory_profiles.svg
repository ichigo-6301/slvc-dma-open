<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="720" viewBox="0 0 1480 720" role="img" aria-labelledby="title desc">
  <title id="title">SLVC DMA RX memory profiles and CDC boundaries</title>
  <desc id="desc">Four profiles show where AXI writes run and how asynchronous command, ordered payload, and completion transactions cross clock domains. AXI AW, W, and B remain together in the memory clock domain.</desc>
  <style>.title{font:700 28px Arial,sans-serif;fill:#0f172a}.sub{font:400 16px Arial,sans-serif;fill:#475569}.head{font:700 18px Arial,sans-serif;fill:#0f172a}.body{font:400 14px Arial,sans-serif;fill:#334155}.tiny{font:400 13px Arial,sans-serif;fill:#475569}.metric{font:700 20px Arial,sans-serif;fill:#166534}.panel{stroke:#334155;stroke-width:2;rx:6}.box{stroke:#64748b;stroke-width:1.8;rx:5}.arrow{stroke:#334155;stroke-width:2.4;fill:none}.cdc{stroke:#d97706;stroke-width:2;stroke-dasharray:7 5;fill:none}</style>
  <rect width="1480" height="720" fill="#ffffff"/>
  <text x="40" y="46" class="title">RX memory profiles and CDC boundaries</text>
  <text x="40" y="74" class="sub">Cross Command / ordered Payload / Completion transactions - never five independent AXI channels.</text>

  <g transform="translate(30 110)"><rect width="330" height="520" fill="#eff6ff" class="panel"/><text x="165" y="38" text-anchor="middle" class="head">Legacy64</text><text x="165" y="63" text-anchor="middle" class="tiny">default compatibility path</text><rect x="48" y="105" width="234" height="58" fill="#fff" class="box"/><text x="165" y="140" text-anchor="middle" class="body">Committed frame source</text><path d="M165 163 V202" class="arrow"/><rect x="48" y="202" width="234" height="70" fill="#fff" class="box"/><text x="165" y="233" text-anchor="middle" class="body">Legacy 64-bit AXI Writer</text><text x="165" y="254" text-anchor="middle" class="tiny">aclk</text><path d="M165 272 V315" class="arrow"/><rect x="48" y="315" width="234" height="66" fill="#fff" class="box"/><text x="165" y="343" text-anchor="middle" class="body">AW / W / B @ aclk</text><text x="165" y="365" text-anchor="middle" class="tiny">64-bit memory W channel</text><text x="165" y="438" text-anchor="middle" class="metric">compatibility profile</text><text x="165" y="469" text-anchor="middle" class="tiny">No RX payload CDC</text></g>

  <g transform="translate(390 110)"><rect width="330" height="520" fill="#ecfdf5" class="panel"/><text x="165" y="38" text-anchor="middle" class="head">Same-clock512</text><text x="165" y="63" text-anchor="middle" class="tiny">wide development profile</text><rect x="48" y="105" width="234" height="58" fill="#fff" class="box"/><text x="165" y="140" text-anchor="middle" class="body">Committed 512-bit source</text><path d="M165 163 V202" class="arrow"/><rect x="48" y="202" width="234" height="70" fill="#fff" class="box"/><text x="165" y="233" text-anchor="middle" class="body">512-bit AXI Writer</text><text x="165" y="254" text-anchor="middle" class="tiny">aclk</text><path d="M165 272 V315" class="arrow"/><rect x="48" y="315" width="234" height="66" fill="#fff" class="box"/><text x="165" y="343" text-anchor="middle" class="body">AW / W / B @ aclk</text><text x="165" y="365" text-anchor="middle" class="tiny">512-bit memory W channel</text><text x="165" y="438" text-anchor="middle" class="metric">64 B/cycle</text><text x="165" y="469" text-anchor="middle" class="tiny">ideal ready-memory RTL interface</text></g>

  <g transform="translate(750 110)"><rect width="330" height="520" fill="#fff7ed" class="panel"/><text x="165" y="38" text-anchor="middle" class="head">Async64</text><text x="165" y="63" text-anchor="middle" class="tiny">dual-clock serialized profile</text><text x="28" y="100" class="tiny">aclk</text><rect x="42" y="112" width="246" height="45" fill="#fff" class="box"/><text x="165" y="140" text-anchor="middle" class="body">Command FIFO</text><rect x="42" y="168" width="246" height="45" fill="#fff" class="box"/><text x="165" y="196" text-anchor="middle" class="body">Ordered payload FIFO</text><rect x="42" y="224" width="246" height="45" fill="#fff" class="box"/><text x="165" y="252" text-anchor="middle" class="body">Completion FIFO</text><line x1="18" y1="292" x2="312" y2="292" class="cdc"/><text x="165" y="286" text-anchor="middle" class="tiny">async transaction boundary</text><text x="28" y="318" class="tiny">mem_clk</text><rect x="42" y="330" width="246" height="48" fill="#fff" class="box"/><text x="165" y="360" text-anchor="middle" class="body">512-to-64 serializer</text><rect x="42" y="390" width="246" height="48" fill="#fff" class="box"/><text x="165" y="420" text-anchor="middle" class="body">64-bit AXI Writer</text><text x="165" y="465" text-anchor="middle" class="metric">8 B/cycle</text><text x="165" y="492" text-anchor="middle" class="tiny">AW / W / B stay in mem_clk</text><text x="165" y="514" text-anchor="middle" class="tiny">completion returns before release</text></g>

  <g transform="translate(1110 110)"><rect width="330" height="520" fill="#f0fdf4" class="panel"/><text x="165" y="38" text-anchor="middle" class="head">Async512</text><text x="165" y="63" text-anchor="middle" class="tiny">dual-clock wide profile</text><text x="28" y="100" class="tiny">aclk</text><rect x="42" y="112" width="246" height="45" fill="#fff" class="box"/><text x="165" y="140" text-anchor="middle" class="body">Command FIFO</text><rect x="42" y="168" width="246" height="45" fill="#fff" class="box"/><text x="165" y="196" text-anchor="middle" class="body">Ordered payload FIFO</text><rect x="42" y="224" width="246" height="45" fill="#fff" class="box"/><text x="165" y="252" text-anchor="middle" class="body">Completion FIFO</text><line x1="18" y1="292" x2="312" y2="292" class="cdc"/><text x="165" y="286" text-anchor="middle" class="tiny">async transaction boundary</text><text x="28" y="318" class="tiny">mem_clk</text><rect x="42" y="340" width="246" height="58" fill="#fff" class="box"/><text x="165" y="368" text-anchor="middle" class="body">512-bit AXI Writer</text><text x="165" y="389" text-anchor="middle" class="tiny">AW / W / B stay in mem_clk</text><text x="165" y="465" text-anchor="middle" class="metric">64 B/cycle</text><text x="165" y="492" text-anchor="middle" class="tiny">completion returns before release</text></g>
  <text x="740" y="677" text-anchor="middle" class="sub">All rates are ideal ready-memory RTL interface results; not measured board DDR throughput.</text>
</svg>
