<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="560" viewBox="0 0 1480 560" role="img" aria-labelledby="title desc">
  <title id="title">SLVC DMA virtual-channel and hybrid-buffering architecture</title>
  <desc id="desc">SHDR64 metadata selects channel context. Admission can reserve fixed per-channel storage or blocks from a shared pool, then a frame-locked source selector feeds the AXI writer and completion queue.</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}.heading{font:700 18px Arial,sans-serif;fill:#0f172a}.body{font:400 14px Arial,sans-serif;fill:#334155}.tiny{font:400 12px Arial,sans-serif;fill:#475569}.box{stroke:#334155;stroke-width:2}.flow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow2)}.thin{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow2)}
    </style>
  </defs>
  <rect width="1480" height="560" fill="#f8fafc"/>
  <text x="48" y="48" class="title">Virtual channels with dedicated and shared storage</text>
  <text x="48" y="78" class="subtitle">Admission reserves resources before commit; committed payload remains frame-atomic through the writer.</text>

  <rect x="45" y="145" width="190" height="245" rx="6" class="box" fill="#dbeafe"/>
  <text x="140" y="180" text-anchor="middle" class="heading">SHDR64 segment</text>
  <rect x="78" y="215" width="124" height="54" rx="5" fill="#fff" stroke="#2563eb"/>
  <text x="140" y="238" text-anchor="middle" class="body">flow_id</text>
  <text x="140" y="258" text-anchor="middle" class="tiny">select context</text>
  <rect x="78" y="290" width="124" height="54" rx="5" fill="#fff" stroke="#2563eb"/>
  <text x="140" y="313" text-anchor="middle" class="body">payload_len</text>
  <text x="140" y="333" text-anchor="middle" class="tiny">reserve capacity</text>

  <path d="M235 267 H285" class="flow"/>

  <rect x="290" y="120" width="235" height="295" rx="6" class="box" fill="#dcfce7"/>
  <text x="407" y="157" text-anchor="middle" class="heading">Channel context</text>
  <rect x="325" y="190" width="165" height="48" rx="5" fill="#fff" stroke="#16a34a"/>
  <text x="407" y="220" text-anchor="middle" class="body">Ring base / pointers</text>
  <rect x="325" y="251" width="165" height="48" rx="5" fill="#fff" stroke="#16a34a"/>
  <text x="407" y="281" text-anchor="middle" class="body">Policy + counters</text>
  <rect x="325" y="312" width="165" height="48" rx="5" fill="#fff" stroke="#16a34a"/>
  <text x="407" y="342" text-anchor="middle" class="body">Space + CQ credit</text>
  <text x="407" y="390" text-anchor="middle" class="tiny">fail closed before commit</text>

  <path d="M525 225 H590" class="thin"/>
  <path d="M525 320 H590" class="thin"/>

  <rect x="595" y="105" width="290" height="160" rx="6" class="box" fill="#fef3c7"/>
  <text x="740" y="140" text-anchor="middle" class="heading">Dedicated fixed ingress</text>
  <rect x="625" y="170" width="105" height="58" rx="5" fill="#fff" stroke="#d97706"/>
  <text x="677" y="194" text-anchor="middle" class="body">Channel 0</text>
  <text x="677" y="215" text-anchor="middle" class="tiny">reserved store</text>
  <rect x="750" y="170" width="105" height="58" rx="5" fill="#fff" stroke="#d97706"/>
  <text x="802" y="194" text-anchor="middle" class="body">Channel N</text>
  <text x="802" y="215" text-anchor="middle" class="tiny">reserved store</text>

  <rect x="595" y="290" width="290" height="160" rx="6" class="box" fill="#cffafe"/>
  <text x="740" y="325" text-anchor="middle" class="heading">Shared frame pool</text>
  <rect x="625" y="354" width="105" height="58" rx="5" fill="#fff" stroke="#0891b2"/>
  <text x="677" y="378" text-anchor="middle" class="body">Free list</text>
  <text x="677" y="399" text-anchor="middle" class="tiny">block allocation</text>
  <rect x="750" y="354" width="105" height="58" rx="5" fill="#fff" stroke="#0891b2"/>
  <text x="802" y="378" text-anchor="middle" class="body">Frame meta</text>
  <text x="802" y="399" text-anchor="middle" class="tiny">commit / release</text>

  <path d="M885 205 H950" class="thin"/>
  <path d="M885 370 H950" class="thin"/>

  <rect x="955" y="145" width="205" height="245" rx="6" class="box" fill="#ede9fe"/>
  <text x="1057" y="180" text-anchor="middle" class="heading">Source selector</text>
  <rect x="990" y="218" width="135" height="64" rx="5" fill="#fff" stroke="#7c3aed"/>
  <text x="1057" y="245" text-anchor="middle" class="body">Lock one frame</text>
  <text x="1057" y="266" text-anchor="middle" class="tiny">no source interleave</text>
  <text x="1057" y="319" text-anchor="middle" class="body">512-bit payload</text>
  <text x="1057" y="344" text-anchor="middle" class="tiny">fixed or shared</text>

  <path d="M1160 267 H1210" class="flow"/>

  <rect x="1215" y="145" width="220" height="245" rx="6" class="box" fill="#fee2e2"/>
  <text x="1325" y="180" text-anchor="middle" class="heading">Commit outputs</text>
  <rect x="1250" y="215" width="150" height="54" rx="5" fill="#fff" stroke="#dc2626"/>
  <text x="1325" y="248" text-anchor="middle" class="body">AXI write bursts</text>
  <rect x="1250" y="292" width="150" height="54" rx="5" fill="#fff" stroke="#dc2626"/>
  <text x="1325" y="316" text-anchor="middle" class="body">Completion Queue</text>
  <text x="1325" y="336" text-anchor="middle" class="tiny">body then owner</text>

  <rect x="45" y="480" width="1390" height="46" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="509" class="body">Directed evidence: channel 0 full, channel 1 packet accepted and completed. Scope: one admission scenario, not universal non-blocking proof.</text>
</svg>
