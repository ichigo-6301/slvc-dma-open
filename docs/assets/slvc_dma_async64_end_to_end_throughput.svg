    <line x1="1170" y1="568" x2="1405" y2="568" stroke="#1456a0" stroke-width="18"/>
    <line x1="1170" y1="643" x2="1480" y2="643" stroke="#1456a0" stroke-width="18"/>
    <line x1="1170" y1="695" x2="1480" y2="695" class="thin"/>
  </g>
