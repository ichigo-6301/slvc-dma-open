  - id: slvc_dma_u5_13ch_bram_architecture_comparison
    profile: slvc_dma_u5_13rx13tx_sync_fpga_bram
    statement: "In Vivado 2018.3 synthesis on xc7z100ffg900-2, the current U5 SLVC wrapper used 45.5 BRAM tiles versus 97.5 tiles for thirteen independent 512-bit by 128-beat payload FIFOs, a 53.333 percent reduction against that shallow-wide FIFO baseline."
