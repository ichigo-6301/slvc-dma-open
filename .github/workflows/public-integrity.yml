name: Public Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v5
      -
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"
      -
        name: Verify showcase, provenance, links, assets, and flow contracts
        run: make showcase-check PYTHON=python3
      -
        name: Exercise public Make profile
        run: make slvc_dma_512_defconfig PYTHON=python3
      -
        name: Show public configuration
        run: make showconfig validate-profile list-stages PYTHON=python3
      -
        name: Inspect selected public stages
        run: make selected-dry-run PYTHON=python3
      -
        name: Exercise async64 Make profile
        run: make slvc_dma_512_rx_async64_defconfig selected-dry-run PYTHON=python3
      -
        name: Exercise C2B4 Make profile
        run: make dma_rx512_reg_c2_b4_m2_sp64_defconfig selected-dry-run PYTHON=python3
      -
        name: Inspect A5 audit utilities
        run: make n45-a5-model-audit-dry-run n45-a5-clock-delivery-audit-dry-run PYTHON=python3
      -
        name: Exercise Makefile from outside the repository
        run: |
          external_dir="$(mktemp -d)"
          make -C "$external_dir" -f "$GITHUB_WORKSPACE/Makefile" \
            CONFIG=configs/slvc_dma_512_rx_async64_defconfig \
            showconfig validate-profile selected-dry-run PYTHON=python3
      -
        name: Confirm tracked worktree hygiene
        run: test -z "$(git status --porcelain)"
  public-windows:
    runs-on: windows-latest
    steps:
      -
        uses: actions/checkout@v5
      -
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"
      -
        name: Verify provenance and documentation links
        run: python flows/scripts/public_hygiene.py --root .
      -
        name: Verify backend, compatibility aliases, and showcase contracts
        run: python -m unittest flows.scripts.test_flowctl_make flows.scripts.test_n45_showcase
      -
        name: Verify generic C2B4 backend without GNU Make
        run: python flows/scripts/flowctl.py --config configs/dma_rx512_reg_c2_b4_m2_sp64_defconfig run-selected --dry-run
      -
        name: Verify one-release compatibility alias
        run: python flows/scripts/flowctl.py n45-c2-reg-audit
      -
        name: Confirm tracked worktree hygiene
        shell: pwsh
        run: if (git status --porcelain) { git status --short; exit 1 }
  frozen-release-integrity:
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      -
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"
      -
        name: Verify immutable tag and its Git-object manifest
        run: python3 flows/scripts/verify_frozen_release.py --repo .
      -
        name: Confirm frozen checkout hygiene
        run: test -z "$(git status --porcelain)"
