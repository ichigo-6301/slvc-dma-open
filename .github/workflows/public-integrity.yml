name: Public Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v5
      -
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"
      -
        name: Verify showcase, provenance, links, assets, and flow contracts
        run: make showcase-check PYTHON=python3
      -
        name: Generate public defconfig
        run: python3 flows/scripts/flowctl.py defconfig --source configs/slvc_dma_512_defconfig
      -
        name: Show public configuration
        run: python3 flows/scripts/flowctl.py show-config
      -
        name: Inspect simulator dry-run
        run: python3 flows/scripts/flowctl.py sim-dry-run
      -
        name: Inspect OOC dry-run
        run: python3 flows/scripts/flowctl.py fpga-ooc-dry-run
      -
        name: Audit C2B4 register profile
        run: python3 flows/scripts/flowctl.py n45-c2-reg-audit
      -
        name: Inspect C2B4 simulation dry-run
        run: python3 flows/scripts/flowctl.py n45-c2-reg-sim-dry-run
      -
        name: Inspect C2B4 DC dry-run
        run: python3 flows/scripts/flowctl.py n45-c2-reg-dc-dry-run
      -
        name: Inspect C2B4 P&R dry-run
        run: python3 flows/scripts/flowctl.py n45-c2-reg-pnr-dry-run
      -
        name: Inspect C2B4 STA dry-run
        run: python3 flows/scripts/flowctl.py n45-c2-reg-sta-dry-run
      -
        name: Inspect Vivado 2022.2 OOC dry-run
        run: python3 flows/scripts/flowctl.py vivado-async64-2022.2-ooc-dry-run
      -
        name: Inspect A5 model-audit dry-run
        run: python3 flows/scripts/flowctl.py n45-a5-model-audit-dry-run
      -
        name: Inspect A5 clock-delivery dry-run
        run: python3 flows/scripts/flowctl.py n45-a5-clock-delivery-audit-dry-run
      -
        name: Confirm tracked worktree hygiene
        run: test -z "$(git status --porcelain)"
  public-windows:
    runs-on: windows-latest
    steps:
      -
        uses: actions/checkout@v5
      -
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"
      -
        name: Verify provenance and documentation links
        run: python flows/scripts/public_hygiene.py --root .
      -
        name: Verify showcase contracts and dry-runs
        run: python -m unittest flows.scripts.test_n45_showcase
      -
        name: Audit C2B4 register profile
        run: python flows/scripts/flowctl.py n45-c2-reg-audit
      -
        name: Confirm tracked worktree hygiene
        shell: pwsh
        run: if (git status --porcelain) { git status --short; exit 1 }
  frozen-release-integrity:
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      -
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"
      -
        name: Verify immutable tag and its Git-object manifest
        run: python3 flows/scripts/verify_frozen_release.py --repo .
      -
        name: Confirm frozen checkout hygiene
        run: test -z "$(git status --porcelain)"
