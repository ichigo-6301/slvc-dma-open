<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="500" viewBox="0 0 1480 500" role="img" aria-labelledby="title desc">
  <title id="title">Verified SLVC DMA throughput, Writer PPA, and ASIC implementation</title>
  <desc id="desc">Three isolated evidence scopes show Writer-only Design Compiler area, ideal-memory interface throughput, and the fixed C2B4 subsystem implementation point.</desc>
  <style>.title{font:700 28px Arial,sans-serif;fill:#0f172a}.sub{font:400 16px Arial,sans-serif;fill:#475569}.head{font:700 18px Arial,sans-serif;fill:#0f172a}.metric{font:700 28px Arial,sans-serif}.body{font:400 14px Arial,sans-serif;fill:#334155}.tiny{font:400 13px Arial,sans-serif;fill:#475569}.panel{stroke:#334155;stroke-width:2;rx:6}</style>
  <rect width="1480" height="500" fill="#ffffff"/>
  <text x="40" y="46" class="title">Verified throughput, Writer PPA, and ASIC implementation</text>
  <text x="40" y="74" class="sub">Evidence-bound fixed points with explicit, non-transferable scope.</text>
  <rect x="35" y="110" width="440" height="300" fill="#eff6ff" class="panel"/>
  <text x="65" y="148" class="head">Writer-only DC OOC</text><text x="65" y="181" class="body">reservation accounting</text><text x="65" y="221" class="metric" fill="#1d4ed8">32 -&gt; 7 bit</text><text x="65" y="274" class="metric" fill="#1d4ed8">-7.97% total area</text><text x="65" y="319" class="metric" fill="#1d4ed8">-15.84% combinational</text><text x="65" y="363" class="tiny">Nangate45 paired DC OOC at 1.5 ns</text><text x="65" y="387" class="tiny">not C2B4 or complete-DMA area</text>
  <rect x="520" y="110" width="440" height="300" fill="#f0fdf4" class="panel"/>
  <text x="550" y="148" class="head">Ideal-memory interface</text><text x="550" y="181" class="body">Same-clock512 / Async512</text><text x="550" y="231" class="metric" fill="#166534">64 B/cycle</text><text x="550" y="284" class="metric" fill="#166534">100% W utilization</text><text x="550" y="329" class="metric" fill="#166534">peak outstanding 4</text><text x="550" y="363" class="tiny">ready-memory RTL workload</text><text x="550" y="387" class="tiny">not board DDR or 10G throughput</text>
  <rect x="1005" y="110" width="440" height="300" fill="#fff7ed" class="panel"/>
  <text x="1035" y="148" class="head">C2B4 subsystem</text><text x="1035" y="181" class="body">two-channel register-expanded RX512</text><text x="1035" y="221" class="metric" fill="#c2410c">550 MHz DC handoff</text><text x="1035" y="258" class="metric" fill="#c2410c">450 MHz route / PT</text><text x="1035" y="300" class="metric" fill="#c2410c">+0.041322 / +0.000341 ns</text><text x="1035" y="340" class="metric" fill="#c2410c">1.04207 mm2</text><text x="1035" y="366" class="body">standard-cell area</text><text x="1035" y="394" class="tiny">physical checks 0; not Fmax or signoff</text>
  <rect x="240" y="438" width="1000" height="40" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
  <text x="740" y="464" text-anchor="middle" class="body">Three separate scopes - not one complete-DMA result</text>
</svg>
