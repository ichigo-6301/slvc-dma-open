    value: 53.333
    unit: percent BRAM tile reduction
    benchmark: SLVC U5 wrapper versus 13 independent 512-bit by 128-beat payload FIFOs
    configuration: "Vivado 2018.3; xc7z100ffg900-2; DMA_MAX_CH=16; 13 RX/13 TX active; 512-bit stream; 64-bit HP0; synchronous 100 MHz board profile"
